<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Mini Web</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Example App</p>
        <h1>Chat with gpt-5-mini</h1>
        <p class="lede">A lightweight browser chat demo backed by the OpenAI Responses API.</p>
      </header>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="composer" class="composer">
        <label class="sr-only" for="message-input">Message</label>
        <textarea id="message-input" name="message" rows="3" placeholder="Ask something short..." required></textarea>
        <div class="composer-actions">
          <p id="status" class="status">Idle</p>
          <button id="send-button" type="submit">Send</button>
        </div>
      </form>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

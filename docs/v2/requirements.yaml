version: 2
product:
  id: oh-my-taegun
  phase: v2-spec-first
requirements:
  - id: V2-REQ-001
    priority: MUST
    title: Interview-derived runtime policy
    description: "시스템은 design interview 중 실제 운영 환경의 모델 가용성과 delivery 승격 정책을 조사해 execution model policy와 delivery policy를 함께 생성해야 한다."
    source_refs: [docs/v2/positioning.md]
  - id: V2-REQ-002
    priority: MUST
    title: No hardcoded baseline model
    description: "특정 baseline 모델명을 완료 기준이나 seed freeze 기준에 하드코딩하지 않아야 한다."
    source_refs: [docs/v2/positioning.md]
  - id: V2-REQ-003
    priority: MUST
    title: Bounded work units
    description: "모든 implementation work unit은 work unit budget 안에서 분해되어야 한다."
    source_refs: [docs/v2/spec.md]
  - id: V2-REQ-004
    priority: MUST
    title: Ambiguity gate before seed freeze
    description: "ambiguity threshold를 넘는 상태에서는 seed를 freeze하지 않아야 한다."
    source_refs: [docs/v2/metrics.yaml]
  - id: V2-REQ-005
    priority: MUST
    title: Convergence is not completion
    description: "ontology similarity 기반 design convergence는 implementation completion과 별개로 판단되어야 한다."
    source_refs: [docs/v2/spec.md]
  - id: V2-REQ-006
    priority: MUST
    title: Verifier-mediated completion
    description: "최종 완료 판정은 verifier decision matrix를 거쳐야 한다."
    source_refs: [docs/v2/spec.yaml]
  - id: V2-REQ-007
    priority: MUST
    title: Verified capability and mapped delivery execution
    description: "검증되지 않은 capability는 execution 단계에서 직접 사용하지 않아야 하며, deploy나 external check는 design interview로 명시 매핑되기 전에는 실행하지 않아야 한다."
    source_refs: [docs/v2/spec.yaml]
  - id: V2-REQ-008
    priority: MUST
    title: Event-sourced recovery
    description: "event log를 source of truth로 두고 phase-aware resume를 지원해야 한다."
    source_refs: [docs/v2/state-schema.yaml]
  - id: V2-REQ-009
    priority: MUST
    title: Acceptance-equivalent parity
    description: "서로 다른 approved model policy를 사용하더라도 acceptance-equivalent outcome을 목표로 해야 한다."
    source_refs: [docs/v2/positioning.md]
  - id: V2-REQ-010
    priority: SHOULD
    title: Legacy regression floor preservation
    description: "V2 설계는 기존 V1 regression floor를 유지한 채 additive하게 도입되어야 한다."
    source_refs: [docs/v2/migration.md]
